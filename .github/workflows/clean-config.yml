name: Clean OpenWrt Config

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: configs/x86_64.config
  DIY_SCRIPT: diy-script.sh
  TZ: Asia/Shanghai
  OPENWRT_BUILD_DEPENDS: >-
    ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential
    bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk
    gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man
    intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev
    libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev
    libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev
    ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools
    python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig
    texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

jobs:
  Clean:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          CLEANUP_DIRS=()
          for dir in /usr/share/dotnet /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"; do
            [ -n "$dir" ] && [ -e "$dir" ] && CLEANUP_DIRS+=("$dir")
          done
          if [ "${#CLEANUP_DIRS[@]}" -gt 0 ]; then
            printf 'Removing preinstalled tool directories:\n'
            printf '  %s\n' "${CLEANUP_DIRS[@]}"
            sudo rm -rf "${CLEANUP_DIRS[@]}"
          else
            echo "No preinstalled tool directories to remove."
          fi

          sudo -E apt-get -y update

          mapfile -t BUILD_KEEP_PACKAGES < <(
            {
              printf '%s\n' $OPENWRT_BUILD_DEPENDS
              apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances $OPENWRT_BUILD_DEPENDS 2>/dev/null |
                sed -nE 's/^[[:space:]]*(Depends|PreDepends):[[:space:]]*([^ <|]+).*/\2/p'
            } | sort -u
          )
          mapfile -t CLEANUP_PACKAGES < <(
            dpkg-query -W -f='${binary:Package}\n' 2>/dev/null |
              sed 's/:amd64$//' |
              sort -u |
              grep -E '^(azure-cli|ghc.*|zulu.*|llvm.*|firefox.*|google.*|dotnet.*|powershell|openjdk.*|mongodb.*|moby.*)$' |
              grep -vxFf <(printf '%s\n' "${BUILD_KEEP_PACKAGES[@]}") || true
          )
          if [ "${#CLEANUP_PACKAGES[@]}" -gt 0 ]; then
            printf 'Purging preinstalled packages:\n'
            printf '  %s\n' "${CLEANUP_PACKAGES[@]}"
            sudo -E apt-get -y purge "${CLEANUP_PACKAGES[@]}" || true
          else
            echo "No preinstalled packages to purge."
          fi
          sudo -E apt-get -y install $OPENWRT_BUILD_DEPENDS
          sudo -E systemctl daemon-reload
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get -y clean
          sudo timedatectl set-timezone "$TZ"

      - name: Clone Source Code
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          # 使用 LuCI openwrt-23.05 分支
          sed -i -E '/coolsnowwolf\/luci/ s/^#*/#/' feeds.conf.default
          sed -i -E '/coolsnowwolf\/luci(\.git)?;openwrt-23\.05/ s/^#*//' feeds.conf.default
          grep -qE '^src-git luci .+;openwrt-23\.05$' feeds.conf.default
          [ "$(grep -c '^src-git luci ' feeds.conf.default)" -eq 1 ]
          cd ..
          echo "OPENWRT_PATH=$PWD/openwrt" >> $GITHUB_ENV

      - name: Install Feeds
        run: |
          cd $OPENWRT_PATH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Configuration
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE $OPENWRT_PATH/.config
          chmod +x $DIY_SCRIPT
          cd $OPENWRT_PATH
          $GITHUB_WORKSPACE/$DIY_SCRIPT

      - name: Clean and Minimize Config
        run: |
          cd $OPENWRT_PATH
          # 选项保全校验（前）：记录仓库 config 里所有显式 =y 的选项（含 INCLUDE 子选项）
          grep -E '^CONFIG_.*=y' "$GITHUB_WORKSPACE/$CONFIG_FILE" | sort > /tmp/before-opts.txt
          make defconfig
          # 选项保全校验（后）：找出 make defconfig 后不再生效的显式选项
          : > /tmp/removed-opts.txt
          while IFS= read -r opt; do
            grep -qxF "$opt" .config || printf '%s\n' "$opt" >> /tmp/removed-opts.txt
          done < /tmp/before-opts.txt
          if [ -s /tmp/removed-opts.txt ]; then
            echo "::warning::以下显式选项因上游变化已失效并被移除（请确认是否影响功能）："
            cat /tmp/removed-opts.txt
          else
            echo "选项保全校验通过：没有显式选项被移除。"
          fi
          ./scripts/diffconfig.sh > defconfig
          cp defconfig $GITHUB_WORKSPACE/$CONFIG_FILE

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add $CONFIG_FILE
          # 组装提交信息：若有被移除的显式选项，一并写入，便于日后追溯
          {
            echo "Auto-clean config [skip ci]"
            if [ -s /tmp/removed-opts.txt ]; then
              echo ""
              echo "因上游变化被移除的显式选项："
              sed 's/^/  - /' /tmp/removed-opts.txt
            fi
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt || echo "No changes to commit"
          git push origin ${{ github.ref_name }}
